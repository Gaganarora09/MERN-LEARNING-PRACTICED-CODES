//Frontend of Signin/Signup page //Connecting frontend to backend 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script src ="https://cdnjs.cloudflare.com/ajax/libs/axios/1.4.0/axios.min.js"></script>
<script>
   async function Signup(){
        let username=document.getElementById("username1").value;
        let password=document.getElementById("password1").value;
        await axios.post("http://localhost:3000/signup",{
            username:username,
            password:password
        })
        alert("User Signed up successfully");
    }
   async function Signin(){
        let username=document.getElementById("username").value;
        let password=document.getElementById("password").value;
        console.log("hello");
        let response=await axios.post("http://localhost:3000/signin",{
            username:username,
            password:password
        })
        if(response.data.token==null){
            alert("User not registered");
        }
        else{
            alert("Signin successful");
            localStorage.setItem("token",response.data.token);
        }
        
   }
   async function getdata(){
    let response=await axios.get("http://localhost:3000/mejwt",{
        headers:{
            token:localStorage.getItem("token")
        } 
    })
    console.log(response.data);
   }
   async function logout(){
    localStorage.clear("token");
   }
</script>
<body><div>
    Signup:<input type="text" placeholder="Username" id="username1">
    <input type="password" placeholder="Password" id="password1">
    <button onclick="Signup()">Signup</button><br>
    Signin:<input type="text" placeholder="Username" id="username">
    <input type="password" placeholder="Password" id="password">
    <button onclick="Signin()">Signin</button><br>
    <button onclick="getdata()" id="mydata">Get Data</button><br>
    <button onclick="logout()">Log out</button>
</div>
</body>
</html>
